(async () => {
    const results = [];
    const assert = (value, message = 'Assertion failed') => { if (!value) throw new Error(message); };
    const equal = (a, b) => assert(JSON.stringify(a) === JSON.stringify(b), `${JSON.stringify(a)} !== ${JSON.stringify(b)}`);
    const test = async (name, run) => {
        try { await run(); results.push(`PASS ${name}`); }
        catch (error) { results.push(`FAIL ${name}: ${error.stack}`); }
    };
    const fixture = (responses = {}, game = {}) => {
        const calls = [];
        const values = {};
        const storage = { get: key => values[key] ?? null, set: (key, value) => { values[key] = value; } };
        const api = { call: async (name, args = {}) => {
            calls.push({ name, args });
            const response = responses[name];
            if (typeof response === 'function') return response(args);
            return structuredClone(response);
        } };
        return { engine: new InterfaceAutomation(game, api, storage), calls, storage };
    };
    await test('syntax of interface and automation', async () => {
        for (const file of ['../interface.js', '../automation.js', '../autopilot.js', '../battle-calculator.js']) {
            const response = await fetch(file);
            new Function(await response.text());
        }

    await test('daily bonus skips collected days, respects VIP threshold and cancellation', async () => {
        const game = { lib: { dailyBonusStatic: { '3_0_0': { vipLevelDouble: 4 } },
            level: { vip: [{ level: 0, vipPoints: 0 }, { level: 4, vipPoints: 100 }] } } };
        for (const [availableVip, vipPoints, expectedVip] of [[true, 100, 1], [true, 99, 0], [false, 100, 0]]) {
            const { engine, calls } = fixture({
                dailyBonusGetInfo: { availableToday: true, availableVip, currentDay: 3 },
                userGetInfo: { vipPoints }
            }, game);
            const statuses = [];
            await engine.run('DAILY_BONUS', status => statuses.push(status));
            equal(calls, [{ name: 'dailyBonusGetInfo', args: {} }, { name: 'userGetInfo', args: {} },

            equal(statuses, ['SCRIPT_DAILY_BONUS_COLLECTED']);
        }
        const collected = fixture({ dailyBonusGetInfo: { availableToday: false } });
        const statuses = [];
        await collected.engine.run('DAILY_BONUS', status => statuses.push(status));
        equal(collected.calls.length, 1);
        equal(statuses, ['SCRIPT_DAILY_BONUS_ALREADY_COLLECTED']);
        const stopped = fixture({ dailyBonusGetInfo: () => {
            stopped.engine.stop();
            return { availableToday: true };
        } }, game);
        await stopped.engine.run('DAILY_BONUS', () => {});
        equal(stopped.calls.length, 1);
    });

    await test('message log appends, expires independently, overwrites at zero and delays countdown TTL', async () => {
        const source = await (await fetch('../interface.js')).text();
        const timers = new Map();
        let sequence = 0;
        const MessageLog = new Function('setTimeout', 'clearTimeout',
            source.slice(source.indexOf('    class MessageLog {'), source.indexOf("    const message = document.createElement('div');"))
                + ';return MessageLog;')((run, delay) => {
                    const id = ++sequence;
                    timers.set(id, { run, delay });
                    return id;
                }, id => timers.delete(id));
        const root = document.createElement('div');
        const log = new MessageLog(root);
        log.write('first');
        log.write('second');
        equal(root.children.length, 1);
        equal(root.textContent, 'second');
        equal(timers.size, 0);
        log.setTTL(5);
        const previousTimer = [...timers.values()][0];
        log.write('third');
        equal([...root.children].map(row => row.textContent), ['second', 'third']);
        previousTimer.run();
        equal(root.textContent, 'third');
        const id = log.write('countdown 2', { pending: true });
        equal(timers.size, 1);
        log.write('countdown 1', { id, pending: true });
        equal(root.children.length, 2);
        equal(timers.size, 1);
        log.write('countdown finished', { id });
        equal(timers.size, 2);
        equal([...timers.values()].map(timer => timer.delay), [5000, 5000]);
        log.setTTL(0);
        equal(root.children.length, 1);
        equal(root.textContent, 'countdown finished');
        equal(timers.size, 0);
        log.write('latest');
        equal(root.textContent, 'latest');
        log.setTTL(-1);
        equal(log.ttl, 0);
    });
    await test('restart reloads the page without API calls and terminates a sequence', async () => {
        const source = await (await fetch('../automation.js')).text();
        let reloads = 0;
        const Engine = new Function('window', source + ';return InterfaceAutomation;')({ location: { reload: () => reloads++ } });
        const engine = new Engine({}, { call: () => { throw new Error('Unexpected API call'); } }, { get: () => null, set() {} });
        await engine.run('RESTART', () => {});
        equal(reloads, 1);
        assert(engine.definitions.RESTART.endsSequence);
        engine.definitions.RESTART.run({}, () => {}, { stopped: true });
        equal(reloads, 1);

        for (const name of names) engine.save(name, { enabled: true });
        const timers = new Map();
        let timerId = 0;
        const dependencies = { execute: async section => {
            await engine.run(section, () => {});
            return engine.lastResult.completed;
        }, sections: () => names, now: () => clock,
            setTimer: (run, delay) => { timers.set(++timerId, { run, delay }); return timerId; },
            clearTimer: id => timers.delete(id) };
        const pilot = new InterfaceAutopilot(engine, storage, dependencies);
        return { pilot, engine, storage, calls, executed, timers, dependencies,
            advance: milliseconds => { clock += milliseconds; }, now: () => clock };
    };
    await test('autopilot enforces five minute inactivity and yields before the next request', async () => {
        const f = pilotFixture();
        f.pilot.configure({ enabled: true, idleMinutes: 1 });
        equal(f.pilot.options.idleMinutes, 5);
        await f.pilot.tick();
        equal(f.executed, []);
        f.advance(299999);
        await f.pilot.tick();
        equal(f.executed, []);
        f.advance(1);
        await f.pilot.tick();
        equal(f.executed, ['A', 'B']);
        f.pilot.activity();
        f.advance(299999);
        await f.pilot.tick();
        equal(f.executed, ['A', 'B']);
        let release;
        f.engine.definitions.A.run = async () => {
            await new Promise(resolve => { release = resolve; });
            await f.engine.api.call('mutation');
        };
        f.advance(1);
        const running = f.pilot.tick();
        assert(release);
        f.pilot.activity();
        release();
        await running;
        equal(f.calls, []);
        equal(f.executed, ['A', 'B']);
        assert(!f.pilot.running);
        assert(f.pilot.due('A'));
    });
    await test('sequence checkpoints survive reload and skip restart before continuing remaining scripts', async () => {
        const f = pilotFixture(['A', 'RESTART', 'B']);
        f.engine.definitions.RESTART.endsSequence = true;
        f.engine.definitions.RESTART.run = async () => {
            const progress = JSON.parse(f.storage.get('autopilotProgress'));
            equal(progress.pending.sections, ['B']);
            f.executed.push('RESTART');
        };
        await f.pilot.run(['A', 'RESTART', 'B']);
        equal(f.executed, ['A', 'RESTART']);
        const resumed = new InterfaceAutopilot(f.engine, f.storage, f.dependencies);
        await resumed.tick();
        equal(f.executed, ['A', 'RESTART', 'B']);
        await resumed.run(['A', 'RESTART', 'B']);
        equal(f.executed, ['A', 'RESTART', 'B']);
        f.advance(300001);
        await resumed.run(['A', 'RESTART', 'B']);
        equal(f.executed, ['A', 'RESTART', 'B', 'A', 'RESTART']);
    });
    await test('autopilot uses the nearest day, expedition or configured time boundary', async () => {
        const f = pilotFixture(['DAILY_BONUS', 'EXPEDITIONS']);
        f.dependencies.userInfo = () => ({ nextDayTs: (f.now() + 180000) / 1000,
            nextServerDayTs: (f.now() + 120000) / 1000 });
        const pilot = new InterfaceAutopilot(f.engine, f.storage, f.dependencies);
        await pilot.run(['DAILY_BONUS']);
        equal(pilot.state.completed.DAILY_BONUS.until, f.now() + 120000);
        f.engine.lastResult = { boundaries: [f.now() + 90000] };
        pilot.checkpoint('EXPEDITIONS');
        equal(pilot.state.completed.EXPEDITIONS.until, f.now() + 90000);
        pilot.configure({ intervals: { EXPEDITIONS: 1 } });
        pilot.checkpoint('EXPEDITIONS');
        equal(pilot.state.completed.EXPEDITIONS.until, f.now() + 60000);
        assert(!pilot.due('DAILY_BONUS'));
        f.storage.set('script:DAILY_BONUS', JSON.stringify({ changed: true }));
        assert(pilot.due('DAILY_BONUS'));
    });
    await test('failed or unfinished scripts are retried and never checkpointed', async () => {
        const f = pilotFixture();
        f.engine.definitions.A.run = async () => 'SCRIPT_TOWER_NEEDS_BATTLE';
        await f.pilot.run(['A', 'B']);
        equal(f.executed, []);
        assert(!f.pilot.state.completed.A);
        f.engine.definitions.A.run = async () => { throw new Error('unavailable'); };
        await f.pilot.run(['A', 'B']);

    await test('disabled autopilot does not run and frequent input persists inactivity across reloads', async () => {
        const f = pilotFixture();

    await test('MD5 standard vectors and padding', () => {

        equal(InterfaceGameApi.md5('abc'), '900150983cd24fb0d6963f7d28e17f72');

    await test('debug logger handles binary data, cycles and shared references', async () => {
        const source = await (await fetch('../interface.js')).text();
        const start = source.indexOf('    ajax.logger =');
        const end = source.indexOf("    ajax.sendFilter.setFunction('get'", start);
        const values = [];
        const ajax = {};
        new Function('ajax', 'sessionStorage', source.slice(start, end))(ajax, { setItem: (key, text) => values.push(text) });
        const buffer = new ArrayBuffer(8);
        buffer.owner = { bytes: new Uint8Array(buffer), buffer };
        ajax.logger('ajax', 'post', {}, buffer);
        equal(JSON.parse(values.pop()).response, { type: 'ArrayBuffer', byteLength: 8 });
        ajax.logger('ajax', 'post', {}, new Uint8Array(buffer));
        equal(JSON.parse(values.pop()).response, { type: 'Uint8Array', byteLength: 8 });
        const cycle = { value: 1 };
        cycle.self = cycle;
        ajax.logger('ajax', 'post', {}, cycle);
        equal(JSON.parse(values.pop()).response, { value: 1, self: '[Circular]' });
        const shared = { value: 2 };
        ajax.logger('ajax', 'post', {}, { a: shared, b: shared });
        equal(JSON.parse(values.pop()).response, { a: { value: 2 }, b: { value: 2 } });
        ajax.logger('ajax', 'post', {}, new ArrayBuffer(0));
        equal(values.length, 0);
    });

    await test('request signing, ordering, error recovery', async () => {
        const NativeXHR = window.XMLHttpRequest;
        const sent = [];
        class FakeXHR { set responseType(value) {} }
        window.XMLHttpRequest = FakeXHR;
        try {
            const original = {
                open(method, url) { this.headers = {}; this.url = url; },
                setRequestHeader(key, value) { this.headers[key] = value; },
                send(body) {
                    sent.push({ headers: this.headers, body });
                    const call = JSON.parse(body).calls[0];
                    this.status = 200;
                    this.response = call.name === 'fail' ? { error: { description: 'expected failure' } }
                        : { results: [{ ident: 'body', result: { response: call.name } }] };
                    queueMicrotask(() => this.onload());
                }
            };
            const api = new InterfaceGameApi(original);
            api.observe({ method: 'POST', url: 'https://example.test/api/', request: { headers: {
                'X-Auth-Token': 'test', 'X-Auth-Session-Id': 'session', 'X-Request-Id': '8',
                'X-Env-Unique-Session-Id': 'unique', 'X-Env-Unique-Session-Uuid': 'uuid'
            } } });
            const first = api.call('one');
            const failure = api.call('fail').catch(error => error.message);
            const third = api.call('three');
            equal(await Promise.all([first, failure, third]), ['one', 'expected failure', 'three']);
            equal(sent.map(item => item.headers['x-request-id']), ['9', '10', '11']);
            for (const request of sent) {
                const signature = `${request.headers['x-request-id']}:test:session:${request.body}:LIBRARY-VERSION=1UNIQUE-SESSION-ID=uniqueUNIQUE-SESSION-UUID=uuid`;
                equal(request.headers['x-auth-signature'], InterfaceGameApi.md5(signature));
            }
        } finally { window.XMLHttpRequest = NativeXHR; }
    });
